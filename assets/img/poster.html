<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root{--dark:#151515;--dark2:#1D1D1C;--line:#30302D;--text:#F3F3F0;--muted:#A3A39D;--brass:#C9AD80;--brick:#9E4833;
    --sans:"Inter","PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--dark);color:var(--text);font-family:var(--sans);
    background-image:linear-gradient(rgba(243,243,240,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(243,243,240,.045) 1px,transparent 1px);
    background-size:36px 36px;display:flex;flex-direction:column;justify-content:center;padding:56px 72px}
  .label{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:14px}
  .sheet{background:var(--dark2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
  .bar{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #2A2A27;font-size:15px}
  .row:last-child{border-bottom:0}
  .tick{width:16px;height:16px;border:1.5px solid #5E5E58;border-radius:3px;display:grid;place-items:center;font-size:10px;color:var(--dark);flex:none}
  .tick.on{background:var(--brass);border-color:var(--brass)}
  .who{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:#92928C;font-size:12.5px}
  .stamp{display:inline-block;border:1.5px solid var(--brick);color:#DCA391;font-size:11px;padding:3px 7px;border-radius:3px;transform:rotate(-3deg);font-weight:600;margin-left:auto}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="label">DockJoy · 产品演示</div>
  <div class="sheet">
    <div class="bar"><span>待审核 · 98 家</span><span>评分 · 理由 · 审核</span><span>按导入时间</span></div>
    <div class="row"><span class="tick on">✓</span><span class="who">欣瑩工業有限公司</span><span class="meta">台中市</span><span class="meta">80</span></div>
    <div class="row"><span class="tick">✓</span><span class="who">義吉CNC車床機械加工廠</span><span class="meta">台中市</span><span class="meta">78</span></div>
    <div class="row"><span class="tick on">✓</span><span class="who">永騰實業有限公司</span><span class="meta">彰化縣</span><span class="meta">76</span></div>
    <div class="row"><span class="tick">✓</span><span class="who">安政企業有限公司</span><span class="meta">新北市</span><span class="meta">72</span></div>
    <div class="row"><span class="tick on">✓</span><span class="who">長明工業有限公司</span><span class="meta">新北市</span><span class="meta">68</span></div>
  </div>
  <div class="foot">
    <span>候选 → 评分 → 起草 → 审核 → 发送</span>
    <span class="stamp">已审核 3 · 待审 2</span>
    <span>55 秒</span>
  </div>
</body>
</html>
